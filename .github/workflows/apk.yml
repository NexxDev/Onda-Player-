          cat > proj/app/src/main/java/com/nexxdev/onda/Data.kt <<'EOF_ONDA'
          package com.nexxdev.onda

          import android.content.ContentUris
          import android.content.Context
          import android.graphics.Bitmap
          import android.media.audiofx.Equalizer
          import android.net.Uri
          import android.provider.MediaStore
          import android.util.LruCache
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.setValue
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata

          data class Song(
              val id: Long,
              val title: String,
              val artist: String,
              val album: String,
              val duration: Long,
              val path: String,
              val added: Long
          ) {
              val uri: Uri get() = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
              val folder: String get() = path.substringBeforeLast('/', "")
              val folderName: String get() = folder.substringAfterLast('/', "").ifEmpty { "Raiz" }
          }

          fun Song.toItem(): MediaItem = MediaItem.Builder()
              .setMediaId(id.toString())
              .setUri(uri)
              .setMediaMetadata(
                  MediaMetadata.Builder()
                      .setTitle(title)
                      .setArtist(artist)
                      .setAlbumTitle(album)
                      .setDurationMs(duration)
                      .build()
              )
              .build()

          fun fmt(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0)
              return "%d:%02d".format(s / 60, s % 60)
          }

          /** Lee TODA la musica del telefono (MediaStore). No hace falta agregar nada a mano. */
          fun loadSongs(ctx: Context): List<Song> {
              val out = ArrayList<Song>()
              val proj = arrayOf(
                  MediaStore.Audio.Media._ID,
                  MediaStore.Audio.Media.TITLE,
                  MediaStore.Audio.Media.ARTIST,
                  MediaStore.Audio.Media.ALBUM,
                  MediaStore.Audio.Media.DURATION,
                  MediaStore.Audio.Media.DATA,
                  MediaStore.Audio.Media.DATE_ADDED
              )
              val sel = MediaStore.Audio.Media.DURATION + " >= 10000"
              try {
                  ctx.contentResolver.query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, proj, sel, null, null)?.use { c ->
                      while (c.moveToNext()) {
                          val path = c.getString(5) ?: ""
                          if (path.contains("/Ringtones/") || path.contains("/Notifications/") || path.contains("/Alarms/")) continue
                          val artist = c.getString(2)
                          out.add(
                              Song(
                                  c.getLong(0),
                                  c.getString(1) ?: "Sin titulo",
                                  if (artist.isNullOrBlank() || artist == "<unknown>") "Artista desconocido" else artist,
                                  c.getString(3) ?: "",
                                  c.getLong(4),
                                  path,
                                  c.getLong(6)
                              )
                          )
                      }
                  }
              } catch (e: Exception) {
              }
              return out
          }

          object ArtCache {
              val bitmaps = LruCache<Long, Bitmap>(300)
              val none = HashSet<Long>()
          }

          /** Ecualizador del sistema enganchado a la sesion de audio del reproductor. */
          object Eq {
              private var e: Equalizer? = null
              var tick by mutableIntStateOf(0)

              private fun prefs(c: Context) = c.getSharedPreferences("onda_eq", Context.MODE_PRIVATE)

              fun attach(c: Context, session: Int) {
                  if (session <= 0) return
                  release()
                  try {
                      val q = Equalizer(0, session)
                      val p = prefs(c)
                      for (i in 0 until q.getNumberOfBands().toInt()) {
                          if (p.contains("b" + i)) q.setBandLevel(i.toShort(), p.getInt("b" + i, 0).toShort())
                      }
                      q.setEnabled(p.getBoolean("on", false))
                      e = q
                  } catch (t: Throwable) {
                      e = null
                  }
                  tick++
              }

              fun release() {
                  try {
                      e?.release()
                  } catch (t: Throwable) {
                  }
                  e = null
              }

              fun bands(): Int = try { e?.getNumberOfBands()?.toInt() ?: 0 } catch (t: Throwable) { 0 }
              fun on(): Boolean = try { e?.getEnabled() ?: false } catch (t: Throwable) { false }

              fun setOn(c: Context, v: Boolean) {
                  try {
                      e?.setEnabled(v)
                  } catch (t: Throwable) {
                  }
                  prefs(c).edit().putBoolean("on", v).apply()
              }

              fun range(): Pair<Int, Int> = try {
                  val r = e!!.getBandLevelRange()
                  Pair(r[0].toInt(), r[1].toInt())
              } catch (t: Throwable) {
                  Pair(-1500, 1500)
              }

              fun freq(i: Int): Int = try { e!!.getCenterFreq(i.toShort()) / 1000 } catch (t: Throwable) { 0 }
              fun level(i: Int): Int = try { e!!.getBandLevel(i.toShort()).toInt() } catch (t: Throwable) { 0 }

              fun setLevel(c: Context, i: Int, l: Int) {
                  try {
                      e?.setBandLevel(i.toShort(), l.toShort())
                  } catch (t: Throwable) {
                  }
                  prefs(c).edit().putInt("b" + i, l).apply()
              }

              fun presets(): List<String> = try {
                  List(e!!.getNumberOfPresets().toInt()) { e!!.getPresetName(it.toShort()) }
              } catch (t: Throwable) {
                  emptyList()
              }

              fun preset(c: Context, i: Int) {
                  try {
                      e?.usePreset(i.toShort())
                      val ed = prefs(c).edit()
                      for (b in 0 until bands()) ed.putInt("b" + b, level(b))
                      ed.apply()
                  } catch (t: Throwable) {
                  }
              }
          }
          EOF_ONDA
          cat > proj/app/src/main/java/com/nexxdev/onda/PlaybackService.kt <<'EOF_ONDA'
          package com.nexxdev.onda

          import android.app.PendingIntent
          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          /** Servicio de reproduccion: da la notificacion con controles y la pantalla de bloqueo. */
          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .build(),
                          true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()
                  player.repeatMode = Player.REPEAT_MODE_ALL
                  player.addListener(object : Player.Listener {
                      override fun onAudioSessionIdChanged(audioSessionId: Int) {
                          Eq.attach(this@PlaybackService, audioSessionId)
                      }
                  })
                  Eq.attach(this, player.audioSessionId)
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  session = MediaSession.Builder(this, player).setSessionActivity(pi).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = session?.player
                  if (p == null || !p.playWhenReady || p.mediaItemCount == 0) stopSelf()
              }

              override fun onDestroy() {
                  Eq.release()
                  session?.let {
                      it.player.release()
                      it.release()
                  }
                  session = null
                  super.onDestroy()
              }
          }
          EOF_ONDA
