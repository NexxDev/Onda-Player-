<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Onda</title>
<style>
  @property --h{syntax:'<number>';inherits:true;initial-value:190}
  :root{
    --h:190;
    --bg:#0e141d; --surface:rgba(255,255,255,.06); --surface2:rgba(255,255,255,.11);
    --text:#eef2f8; --muted:#93a3ba; --accent:#6fd3c0; --accent-ink:#082822; --danger:#ff8f8f;
    transition:--h .9s ease;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(90% 55% at 50% -5%, hsl(var(--h) 60% 30% / .85), transparent 70%),
      radial-gradient(70% 40% at 100% 45%, hsl(calc(var(--h) + 60) 55% 22% / .45), transparent 70%);
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px}
  header h1{font-size:1.1rem;margin:0;font-weight:700}
  .add{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:9px 16px;font-size:.88rem}

  .now{padding:4px 22px 6px;display:flex;flex-direction:column;align-items:center}
  .cover{
    width:min(54vw,230px,30vh);aspect-ratio:1;border-radius:30px;
    display:grid;place-items:center;font-size:3.6rem;font-weight:800;color:rgba(255,255,255,.92);
    box-shadow:0 20px 44px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.1);
    transition:transform .3s ease;margin-top:6px;
  }
  .cover.playing{transform:scale(1.04)}
  .title{margin:14px 0 2px;font-size:1.2rem;font-weight:700;text-align:center;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{margin:0;color:var(--muted);font-size:.84rem}
  canvas#viz{width:100%;max-width:460px;height:34px;margin-top:8px}

  .seek{width:100%;max-width:460px;margin-top:2px}
  .times{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%}
  input[type=range]::-webkit-slider-runnable-track{
    height:5px;border-radius:5px;
    background:linear-gradient(to right,var(--accent) var(--p),rgba(255,255,255,.16) var(--p));
  }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}

  .controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
  .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .ico svg{width:24px;height:24px;fill:currentColor}
  .ico.on{color:var(--accent)}
  .ico.skip{color:var(--text)}
  .ico.main{width:70px;height:70px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px hsl(var(--h) 60% 40% / .5)}
  .ico.main svg{width:32px;height:32px}
  .ico:active{transform:scale(.94)}

  .chips{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
  .chip{background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.8rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .chip svg{width:16px;height:16px;fill:currentColor}
  .chip.on{color:var(--accent);background:rgba(111,211,192,.12)}
  .volrow{display:flex;align-items:center;gap:8px;width:100%;max-width:460px;color:var(--muted)}
  .volrow svg{width:20px;height:20px;fill:currentColor;flex:none}

  .list-wrap{flex:1;min-height:150px;background:rgba(10,15,23,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:26px 26px 0 0;display:flex;flex-direction:column;margin-top:8px;border-top:1px solid rgba(255,255,255,.08)}
  .list-head{display:flex;gap:10px;align-items:center;padding:12px 14px 6px}
  .search{flex:1;background:var(--surface);border:0;border-radius:999px;padding:10px 16px;color:var(--text);font:inherit;font-size:.9rem}
  .search::placeholder{color:var(--muted)}
  .count{color:var(--muted);font-size:.78rem}
  .clear{color:var(--danger);font-size:.8rem;padding:8px}
  ul{list-style:none;margin:0;padding:0 8px 12px;overflow-y:auto;flex:1;overscroll-behavior:contain}
  li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;cursor:pointer}
  li:active{background:var(--surface)}
  li.active{background:var(--surface2)}
  li .thumb{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.92);position:relative;overflow:hidden}
  li .info{flex:1;min-width:0}
  li .name{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li.active .name{color:var(--accent);font-weight:600}
  li .meta{font-size:.75rem;color:var(--muted)}
  li .del{color:var(--muted);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
  li .del svg{width:18px;height:18px;fill:currentColor}
  .bars{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:12px}
  li.active .bars{display:flex}
  .bars i{width:4px;height:6px;background:var(--accent);border-radius:2px}
  body.is-playing li.active .bars i{animation:bounce .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.2s!important}
  .bars i:nth-child(3){animation-delay:.4s!important}
  @keyframes bounce{0%,100%{height:5px}50%{height:20px}}
  .empty{padding:32px 24px;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.55}

  /* Ecualizador */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#141c28;border-radius:26px 26px 0 0;
    padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s ease;
    max-width:520px;margin:0 auto;border-top:1px solid rgba(255,255,255,.1)}
  .sheet.show{transform:none}
  .grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 12px}
  .sheet h2{margin:0 0 10px;font-size:1.05rem}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .eqrow{display:grid;grid-template-columns:54px 1fr 40px;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
  .eqrow output{text-align:right;font-variant-numeric:tabular-nums}
  .eqnote{font-size:.78rem;color:var(--muted);margin:8px 0 0}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#25334a;padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-height:640px){.cover{display:none}.title{margin-top:8px}}
</style>
</head>
<body>

<header>
  <h1>Onda</h1>
  <button class="add" id="addBtn">Agregar música</button>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.oga,.opus,.flac,.m4a,.aac,.weba,.wma" multiple hidden>
</header>

<section class="now">
  <div class="cover" id="cover">♪</div>
  <p class="title" id="title">Nada reproduciéndose</p>
  <p class="sub" id="sub">Agrega canciones para empezar</p>
  <canvas id="viz" aria-hidden="true"></canvas>

  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="controls">
    <button class="ico" id="shuffle" aria-label="Aleatorio">
      <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2.3 2.3L4 19.1 5.4 20.5 18.2 7.7 20.5 10V4h-6zm.3 9.8-1.4 1.4 3.4 3.4-2.3 2.3h6v-6l-2.3 2.3-3.4-3.4z"/></svg>
    </button>
    <button class="ico skip" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="ico main" id="play" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ico skip" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <button class="ico" id="repeat" aria-label="Repetir"><svg viewBox="0 0 24 24" id="repeatIcon"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
  </div>

  <div class="volrow">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volumen">
  </div>

  <div class="chips">
    <button class="chip" id="eqBtn"><svg viewBox="0 0 24 24"><path d="M10 20h4V4h-4v16zm-6 0h4v-8H4v8zM16 9v11h4V9h-4z"/></svg>Ecualizador</button>
    <button class="chip" id="speed">1×</button>
    <button class="chip" id="sleep">Dormir: no</button>
  </div>
</section>

<section class="list-wrap">
  <div class="list-head">
    <input class="search" id="search" type="search" placeholder="Buscar en la lista">
    <span class="count" id="count"></span>
    <button class="clear" id="clearAll">Vaciar</button>
  </div>
  <ul id="list"></ul>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Ecualizador">
  <div class="grab"></div>
  <h2>Ecualizador</h2>
  <div class="presets" id="presets"></div>
  <div id="eqRows"></div>
  <p class="eqnote" id="eqNote"></p>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const AUDIO_EXT = /\.(mp3|wav|ogg|oga|opus|flac|m4a|aac|weba|wma|mka)$/i;

  let tracks = [], current = -1, shuffle = false, repeat = 0, query = '';
  let sleepTimer = null, sleepIdx = 0;
  const sleepOpts = [0, 15, 30, 60];
  const speeds = [0.75, 1, 1.25, 1.5, 2];
  let speedIdx = 1;

  /* ---------- utilidades ---------- */
  const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const hue = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const gradient = name => { const h = hue(name); return `linear-gradient(135deg,hsl(${h} 55% 44%),hsl(${(h + 50) % 360} 60% 28%))`; };
  const cleanName = n => n.replace(/\.[^.]+$/, '').replace(/_+/g, ' ');
  const ext = n => (n.match(/\.([^.]+)$/) || [, '?'])[1].toUpperCase();
  const mb = b => (b / 1048576).toFixed(1) + ' MB';
  let toastT;
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };
  const setFill = el => el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min)) * 100 + '%');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- IndexedDB ---------- */
  let db = null;
  const openDB = () => new Promise(res => {
    try {
      const req = indexedDB.open('reproductor-db', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const dbAll = () => new Promise(res => {
    if (!db) return res([]);
    try { const r = db.transaction('tracks').objectStore('tracks').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch (e) { res([]); }
  });
  const dbOp = fn => { if (!db) return; try { fn(db.transaction('tracks', 'readwrite').objectStore('tracks')); } catch (e) {} };

  /* ---------- Audio: ecualizador + visualizador ---------- */
  const BANDS = [
    { f: 60, t: 'lowshelf', n: '60 Hz' }, { f: 230, t: 'peaking', n: '230 Hz' },
    { f: 910, t: 'peaking', n: '910 Hz' }, { f: 3600, t: 'peaking', n: '3.6 kHz' },
    { f: 14000, t: 'highshelf', n: '14 kHz' }
  ];
  const PRESETS = {
    'Normal': [0, 0, 0, 0, 0], 'Bajos': [7, 4, 0, -1, 0], 'Voz': [-2, 1, 4, 3, -1],
    'Agudos': [-2, 0, 1, 4, 7], 'Rock': [5, 2, -2, 2, 5]
  };
  let eqGains = store.get('eq', [0, 0, 0, 0, 0]);
  let ctx = null, filters = [], analyser = null, gainNode = null, data = null, graphOK = false;

  function initAudio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      const src = ctx.createMediaElementSource(audio);
      let node = src;
      filters = BANDS.map((b, i) => {
        const f = ctx.createBiquadFilter();
        f.type = b.t; f.frequency.value = b.f; f.Q.value = 1; f.gain.value = eqGains[i];
        node.connect(f); node = f; return f;
      });
      analyser = ctx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = .82;
      gainNode = ctx.createGain(); gainNode.gain.value = vol.value / 100;
      node.connect(analyser); analyser.connect(gainNode); gainNode.connect(ctx.destination);
      data = new Uint8Array(analyser.frequencyBinCount);
      audio.volume = 1;
      graphOK = true;
    } catch (e) { graphOK = false; }
    $('eqNote').textContent = graphOK ? '' : 'Tu navegador no permite el ecualizador.';
  }
  function setVolume() {
    const v = vol.value / 100;
    if (graphOK && gainNode) gainNode.gain.value = v; else audio.volume = v;
  }

  // Panel del ecualizador
  const rows = $('eqRows'), presetsEl = $('presets');
  const sliders = BANDS.map((b, i) => {
    const row = document.createElement('div'); row.className = 'eqrow';
    row.innerHTML = `<span>${b.n}</span><input type="range" min="-12" max="12" step="1" value="${eqGains[i]}" aria-label="${b.n}"><output></output>`;
    rows.appendChild(row);
    const input = row.querySelector('input'), out = row.querySelector('output');
    const show = () => { out.textContent = (input.value > 0 ? '+' : '') + input.value + ' dB'; setFill(input); };
    input.addEventListener('input', () => { eqGains[i] = +input.value; show(); applyEQ(); markPreset(); });
    show();
    return { input, show };
  });
  function applyEQ() { filters.forEach((f, i) => { f.gain.value = eqGains[i]; }); store.set('eq', eqGains); }
  function markPreset() {
    [...presetsEl.children].forEach(b => b.classList.toggle('on', PRESETS[b.textContent].every((g, i) => g === eqGains[i])));
  }
  Object.keys(PRESETS).forEach(name => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = name;
    b.onclick = () => { eqGains = [...PRESETS[name]]; sliders.forEach((s, i) => { s.input.value = eqGains[i]; s.show(); }); applyEQ(); markPreset(); };
    presetsEl.appendChild(b);
  });
  markPreset();
  const sheetToggle = open => { $('sheet').classList.toggle('show', open); $('scrim').classList.toggle('show', open); };
  $('eqBtn').onclick = () => { initAudio(); sheetToggle(true); };
  $('scrim').onclick = () => sheetToggle(false);

  // Visualizador
  const cv = $('viz'), g = cv.getContext('2d');
  function sizeCanvas() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; }
  window.addEventListener('resize', sizeCanvas); sizeCanvas();
  function draw() {
    requestAnimationFrame(draw);
    g.clearRect(0, 0, cv.width, cv.height);
    if (!analyser || audio.paused) return;
    analyser.getByteFrequencyData(data);
    const n = 36, bw = cv.width / n, step = Math.floor(data.length * 0.75 / n) || 1;
    g.fillStyle = '#6fd3c0';
    for (let i = 0; i < n; i++) {
      const v = data[i * step] / 255, h = Math.max(3, v * cv.height);
      g.globalAlpha = .35 + v * .65;
      g.fillRect(i * bw + bw * .2, cv.height - h, bw * .6, h);
    }
    g.globalAlpha = 1;
  }
  draw();

  /* ---------- lista ---------- */
  function renderList() {
    const ul = $('list'); ul.innerHTML = '';
    $('count').textContent = tracks.length ? tracks.length + (tracks.length === 1 ? ' canción' : ' canciones') : '';
    if (!tracks.length) {
      ul.innerHTML = '<div class="empty">Tu lista está vacía.<br>Toca «Agregar música» y elige tus archivos (mp3, flac, wav, ogg, m4a, opus, aac).</div>';
      return;
    }
    const q = query.trim().toLowerCase(); let shown = 0;
    tracks.forEach((t, i) => {
      if (q && !t.name.toLowerCase().includes(q)) return;
      shown++;
      const li = document.createElement('li');
      if (i === current) li.classList.add('active');
      li.innerHTML = `
        <div class="thumb" style="background:${gradient(t.name)}">${(cleanName(t.name)[0] || '♪').toUpperCase()}<div class="bars"><i></i><i></i><i></i></div></div>
        <div class="info"><div class="name"></div><div class="meta">${ext(t.name)} · ${mb(t.size)}</div></div>
        <button class="del" aria-label="Quitar"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>`;
      li.querySelector('.name').textContent = cleanName(t.name);
      li.addEventListener('click', e => { if (e.target.closest('.del')) removeTrack(i); else playIndex(i); });
      ul.appendChild(li);
    });
    if (!shown) ul.innerHTML = '<div class="empty">No hay resultados.</div>';
  }

  /* ---------- reproducción ---------- */
  function playIndex(i) {
    if (i < 0 || i >= tracks.length) return;
    initAudio();
    current = i;
    audio.src = tracks[i].url;
    audio.playbackRate = speeds[speedIdx];
    audio.play().catch(() => {});
    updateNow(); renderList();
    const a = $('list').querySelector('li.active'); if (a) a.scrollIntoView({ block: 'nearest' });
  }
  function updateNow() {
    const t = tracks[current], cover = $('cover');
    if (!t) {
      $('title').textContent = 'Nada reproduciéndose'; $('sub').textContent = 'Agrega canciones para empezar';
      cover.style.background = 'var(--surface2)'; cover.textContent = '♪';
      document.documentElement.style.setProperty('--h', 190); document.title = 'Onda'; return;
    }
    $('title').textContent = cleanName(t.name);
    $('sub').textContent = `${ext(t.name)} · ${mb(t.size)}`;
    cover.style.background = gradient(t.name);
    cover.textContent = (cleanName(t.name)[0] || '♪').toUpperCase();
    document.documentElement.style.setProperty('--h', hue(t.name));
    document.title = cleanName(t.name);
    if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: cleanName(t.name), artist: 'Onda' }); } catch (e) {} }
  }
  function next(auto) {
    if (!tracks.length) return;
    if (auto && repeat === 2) { audio.currentTime = 0; audio.play(); return; }
    let n;
    if (shuffle && tracks.length > 1) { do { n = Math.floor(Math.random() * tracks.length); } while (n === current); }
    else {
      n = current + 1;
      if (n >= tracks.length) { if (repeat === 1 || !auto) n = 0; else { audio.pause(); audio.currentTime = 0; return; } }
    }
    playIndex(n);
  }
  function prev() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    playIndex(current <= 0 ? tracks.length - 1 : current - 1);
  }
  function toggle() {
    if (current < 0) { if (tracks.length) playIndex(0); return; }
    initAudio();
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }
  function removeTrack(i) {
    const t = tracks[i];
    URL.revokeObjectURL(t.url); dbOp(s => s.delete(t.id)); tracks.splice(i, 1);
    if (i === current) { audio.pause(); audio.removeAttribute('src'); audio.load(); current = -1; updateNow(); }
    else if (i < current) current--;
    renderList();
  }
  async function addFiles(list) {
    const files = [...list].filter(f => f.type.startsWith('audio/') || AUDIO_EXT.test(f.name));
    if (!files.length) { toast('No se encontraron archivos de audio'); return; }
    let added = 0;
    for (const f of files) {
      if (tracks.some(t => t.name === f.name && t.size === f.size)) continue;
      const t = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 8), name: f.name, size: f.size, type: f.type, blob: f, url: URL.createObjectURL(f) };
      tracks.push(t);
      dbOp(s => s.put({ id: t.id, name: t.name, size: t.size, type: t.type, blob: f }));
      added++;
    }
    renderList();
    toast(added ? `${added} agregada${added > 1 ? 's' : ''}` : 'Ya estaban en la lista');
    if (current < 0 && tracks.length) playIndex(0);
  }

  /* ---------- eventos ---------- */
  $('addBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('play').onclick = toggle;
  $('next').onclick = () => next(false);
  $('prev').onclick = prev;
  $('shuffle').onclick = () => { shuffle = !shuffle; $('shuffle').classList.toggle('on', shuffle); toast(shuffle ? 'Aleatorio activado' : 'Aleatorio desactivado'); };
  $('repeat').onclick = () => {
    repeat = (repeat + 1) % 3;
    $('repeat').classList.toggle('on', repeat > 0);
    $('repeatIcon').innerHTML = repeat === 2
      ? '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/>'
      : '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
    toast(['Repetir: no', 'Repetir: toda la lista', 'Repetir: una canción'][repeat]);
  };
  $('speed').onclick = () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    audio.playbackRate = speeds[speedIdx];
    $('speed').textContent = speeds[speedIdx] + '×';
    $('speed').classList.toggle('on', speeds[speedIdx] !== 1);
  };
  $('sleep').onclick = () => {
    sleepIdx = (sleepIdx + 1) % sleepOpts.length;
    clearTimeout(sleepTimer);
    const m = sleepOpts[sleepIdx];
    $('sleep').textContent = m ? `Dormir: ${m} min` : 'Dormir: no';
    $('sleep').classList.toggle('on', !!m);
    if (m) sleepTimer = setTimeout(() => {
      audio.pause(); sleepIdx = 0; $('sleep').textContent = 'Dormir: no'; $('sleep').classList.remove('on'); toast('Temporizador terminado');
    }, m * 60000);
  };
  $('clearAll').onclick = () => {
    if (!tracks.length || !confirm('¿Vaciar toda la lista?')) return;
    audio.pause(); audio.removeAttribute('src'); audio.load();
    tracks.forEach(t => URL.revokeObjectURL(t.url));
    tracks = []; current = -1; dbOp(s => s.clear()); updateNow(); renderList();
  };
  $('search').oninput = e => { query = e.target.value; renderList(); };

  const seek = $('seek'), vol = $('vol');
  let seeking = false;
  vol.value = store.get('vol', 100);
  seek.addEventListener('input', () => { seeking = true; setFill(seek); $('cur').textContent = fmt(seek.value / 1000 * (audio.duration || 0)); });
  seek.addEventListener('change', () => { if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; seeking = false; });
  vol.addEventListener('input', () => { setFill(vol); setVolume(); store.set('vol', +vol.value); });
  setFill(seek); setFill(vol); setVolume();

  audio.addEventListener('timeupdate', () => {
    if (seeking || !audio.duration) return;
    seek.value = audio.currentTime / audio.duration * 1000; setFill(seek);
    $('cur').textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(audio.duration); });
  audio.addEventListener('play', () => {
    $('playIcon').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    $('cover').classList.add('playing'); document.body.classList.add('is-playing');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', () => {
    $('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    $('cover').classList.remove('playing'); document.body.classList.remove('is-playing');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });
  audio.addEventListener('ended', () => next(true));
  audio.addEventListener('error', () => {
    if (current < 0) return;
    toast('No se pudo reproducir este archivo');
    if (tracks.length > 1) setTimeout(() => next(true), 800);
  });

  if ('mediaSession' in navigator) {
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
    set('play', () => audio.play()); set('pause', () => audio.pause());
    set('previoustrack', prev); set('nexttrack', () => next(false));
    set('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  }
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'search') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') audio.currentTime += 5;
    if (e.code === 'ArrowLeft') audio.currentTime -= 5;
  });

  /* ---------- inicio ---------- */
  (async () => {
    db = await openDB();
    (await dbAll()).forEach(s => { s.url = URL.createObjectURL(s.blob); tracks.push(s); });
    renderList();
  })();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
