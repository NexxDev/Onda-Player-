          @Composable
          fun OndaApp(vm: PlayerVM = viewModel()) {
              val ctx = LocalContext.current
              val audioPerm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO
              else Manifest.permission.READ_EXTERNAL_STORAGE

              fun has(p: String) = ContextCompat.checkSelfPermission(ctx, p) == PackageManager.PERMISSION_GRANTED

              var granted by remember { mutableStateOf(has(audioPerm)) }
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  granted = has(audioPerm)
                  if (granted) vm.ensureLoaded()
              }

              fun ask() {
                  val need = mutableListOf<String>()
                  if (!has(audioPerm)) need.add(audioPerm)
                  if (Build.VERSION.SDK_INT >= 33 && !has(Manifest.permission.POST_NOTIFICATIONS)) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isEmpty()) vm.ensureLoaded() else launcher.launch(need.toTypedArray())
              }

              LaunchedEffect(Unit) { ask() }

              Surface(Modifier.fillMaxSize(), color = OBg, contentColor = Color.White) {
                  if (granted) {
                      Main(vm)
                  } else {
                      Column(
                          Modifier.fillMaxSize().padding(32.dp),
                          verticalArrangement = Arrangement.Center,
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text("Onda", fontSize = 40.sp, fontWeight = FontWeight.ExtraBold)
                          Spacer(Modifier.height(12.dp))
                          Text(
                              "Necesito permiso para leer la musica de tu telefono y encontrarla sola.",
                              color = OGrey
                          )
                          Spacer(Modifier.height(24.dp))
                          Button(onClick = { ask() }) { Text("Dar permiso") }
                      }
                  }
              }
          }

          @Composable
          fun Main(vm: PlayerVM) {
              var tab by remember { mutableIntStateOf(0) }
              var open by remember { mutableStateOf<String?>(null) }
              var search by remember { mutableStateOf(false) }
              var sortDlg by remember { mutableStateOf(false) }
              var player by remember { mutableStateOf(false) }

              BackHandler(enabled = player) { player = false }
              BackHandler(enabled = !player && open != null) { open = null }
              BackHandler(enabled = !player && open == null && search) {
                  search = false
                  vm.query = ""
              }

              val all = remember(vm.songs, vm.query, vm.sort) { vm.sorted(vm.songs) }

              Box(Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize()) {
                      Row(
                          Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp).height(56.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          if (search) {
                              IconButton(onClick = {
                                  search = false
                                  vm.query = ""
                              }) { Icon(Icons.AutoMirrored.Rounded.ArrowBack, contentDescription = null) }
                              TextField(
                                  value = vm.query,
                                  onValueChange = { vm.query = it },
                                  placeholder = { Text("Buscar mi musica") },
                                  singleLine = true,
                                  shape = RoundedCornerShape(28.dp),
                                  modifier = Modifier.weight(1f),
                                  colors = TextFieldDefaults.colors(
                                      focusedContainerColor = OCard,
                                      unfocusedContainerColor = OCard,
                                      focusedIndicatorColor = Color.Transparent,
                                      unfocusedIndicatorColor = Color.Transparent
                                  )
                              )
                          } else {
                              Text(
                                  "Onda",
                                  fontSize = 30.sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  modifier = Modifier.weight(1f)
                              )
                              IconButton(onClick = { search = true }) {
                                  Icon(Icons.Rounded.Search, contentDescription = null, modifier = Modifier.size(28.dp))
                              }
                              IconButton(onClick = { sortDlg = true }) {
                                  Icon(Icons.AutoMirrored.Rounded.Sort, contentDescription = null, modifier = Modifier.size(28.dp))
                              }
                              IconButton(onClick = { vm.refresh() }) {
                                  Icon(Icons.Rounded.Refresh, contentDescription = null, modifier = Modifier.size(26.dp))
                              }
                          }
                      }

                      val tabs = listOf("Canciones", "Carpetas", "Artistas", "Favoritas")
                      Row(
                          Modifier.horizontalScroll(rememberScrollState()).padding(horizontal = 16.dp),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          tabs.forEachIndexed { i, t ->
                              Chip(t, tab == i) {
                                  tab = i
                                  open = null
                              }
                          }
                      }
                      Spacer(Modifier.height(8.dp))

                      Box(Modifier.weight(1f)) {
                          when (tab) {
                              0 -> SongList(vm, all, true)
                              1 -> GroupTab(vm, all, open, { open = it }, { it.folder }, { it.folderName }, Icons.Rounded.Folder)
                              2 -> GroupTab(vm, all, open, { open = it }, { it.artist }, { it.artist }, Icons.Rounded.Person)
                              else -> SongList(vm, all.filter { it.id.toString() in vm.favs }, true)
                          }
                      }

                      MiniPlayer(vm, onOpen = { player = true }, onStartAll = { vm.play(all, 0, true) })
                  }

                  AnimatedVisibility(
                      visible = player,
                      enter = slideInVertically(initialOffsetY = { it }),
                      exit = slideOutVertically(targetOffsetY = { it })
                  ) {
                      PlayerScreen(vm) { player = false }
                  }
              }

              if (sortDlg) {
                  AlertDialog(
                      onDismissRequest = { sortDlg = false },
                      confirmButton = {},
                      containerColor = OCard,
                      title = { Text("Ordenar canciones por") },
                      text = {
                          Column {
                              listOf(
                                  "recent" to "Mas recientes",
                                  "az" to "A a Z",
                                  "artist" to "Artista",
                                  "long" to "Duracion mas larga"
                              ).forEach { (k, n) ->
                                  Text(
                                      n,
                                      modifier = Modifier.fillMaxWidth().clickable {
                                          vm.setSort(k)
                                          sortDlg = false
                                      }.padding(vertical = 14.dp),
                                      fontSize = 17.sp,
                                      color = if (vm.sort == k) OBlue else Color.White
                                  )
                              }
                          }
                      }
                  )
              }
          }

          @Composable
          fun Chip(text: String, selected: Boolean, onClick: () -> Unit) {
              Box(
                  Modifier.clip(RoundedCornerShape(50))
                      .background(if (selected) OBlue else OCard)
                      .clickable(onClick = onClick)
                      .padding(horizontal = 20.dp, vertical = 12.dp)
              ) {
                  Text(text, color = Color.White, fontSize = 15.sp)
              }
          }

          @Composable
          fun Art(id: Long, modifier: Modifier, iconSize: Dp = 28.dp, radius: Dp = 14.dp) {
              val ctx = LocalContext.current
              val bmp by produceState<Bitmap?>(null, id) {
                  value = ArtCache.bitmaps.get(id)
                  if (value == null && id >= 0 && Build.VERSION.SDK_INT >= 29 && id !in ArtCache.none) {
                      val b = withContext(Dispatchers.IO) {
                          try {
                              ctx.contentResolver.loadThumbnail(
                                  ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id),
                                  Size(300, 300),
                                  null
                              )
                          } catch (e: Exception) {
                              null
                          }
                      }
                      if (b != null) ArtCache.bitmaps.put(id, b) else ArtCache.none.add(id)
                      value = b
                  }
              }
              Box(
                  modifier.clip(RoundedCornerShape(radius)).background(OTile),
                  contentAlignment = Alignment.Center
              ) {
                  val b = bmp
                  if (b != null) {
                      Image(b.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  } else {
                      Icon(
                          Icons.Rounded.MusicNote,
                          contentDescription = null,
                          modifier = Modifier.size(iconSize),
                          tint = Color(0xFF7C7A8C)
                      )
                  }
              }
          }

          @Composable
          fun SongList(vm: PlayerVM, list: List<Song>, header: Boolean) {
              if (list.isEmpty()) {
                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Text(if (vm.loading) "Buscando musica..." else "No hay canciones", color = OGrey)
                  }
                  return
              }
              val curId = vm.current?.mediaId
              LazyColumn(contentPadding = PaddingValues(bottom = 16.dp)) {
                  if (header) {
                      item {
                          Row(
                              Modifier.fillMaxWidth().clickable { vm.play(list, 0, true) }
                                  .padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Rounded.Shuffle, contentDescription = null, tint = OBlue)
                              Spacer(Modifier.width(12.dp))
                              Text(
                                  "Reproducir aleatorio (" + list.size + ")",
                                  color = OBlue,
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }
                  }
                  itemsIndexed(list, key = { _, s -> s.id }) { i, s ->
                      SongRow(
                          s,
                          s.id.toString() == curId,
                          s.id.toString() in vm.favs,
                          onClick = { vm.play(list, i) },
                          onFav = { vm.toggleFav(s.id.toString()) }
                      )
                  }
              }
          }

          @Composable
          fun SongRow(s: Song, cur: Boolean, fav: Boolean, onClick: () -> Unit, onFav: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().clickable(onClick = onClick).padding(horizontal = 16.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Art(s.id, Modifier.size(56.dp))
                  Spacer(Modifier.width(14.dp))
                  Column(Modifier.weight(1f)) {
                      Text(
                          s.title,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          color = if (cur) OBlue else Color.White,
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Medium
                      )
                      Text(
                          s.artist + " \u00B7 " + fmt(s.duration),
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          color = OGrey,
                          fontSize = 13.sp
                      )
                  }
                  IconButton(onClick = onFav) {
                      Icon(
                          if (fav) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                          contentDescription = null,
                          tint = if (fav) OBlue else OGrey
                      )
                  }
              }
          }

          @Composable
          fun GroupTab(
              vm: PlayerVM,
              songs: List<Song>,
              open: String?,
              onOpen: (String?) -> Unit,
              key: (Song) -> String,
              name: (Song) -> String,
              icon: ImageVector
          ) {
              val groups = remember(songs) {
                  songs.groupBy(key).toList().sortedBy { name(it.second.first()).lowercase() }
              }
              if (open == null) {
                  LazyColumn(contentPadding = PaddingValues(bottom = 16.dp)) {
                      items(groups, key = { it.first }) { g ->
                          Row(
                              Modifier.fillMaxWidth().clickable { onOpen(g.first) }
                                  .padding(horizontal = 16.dp, vertical = 8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(
                                  Modifier.size(56.dp).clip(RoundedCornerShape(14.dp)).background(OCard),
                                  contentAlignment = Alignment.Center
                              ) { Icon(icon, contentDescription = null, tint = OGrey) }
                              Spacer(Modifier.width(14.dp))
                              Column {
                                  Text(
                                      name(g.second.first()),
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      fontSize = 16.sp,
                                      fontWeight = FontWeight.Medium
                                  )
                                  Text(g.second.size.toString() + " canciones", color = OGrey, fontSize = 13.sp)
                              }
                          }
                      }
                  }
              } else {
                  SongList(vm, groups.firstOrNull { it.first == open }?.second ?: emptyList(), true)
              }
          }

          @Composable
          fun MiniPlayer(vm: PlayerVM, onOpen: () -> Unit, onStartAll: () -> Unit) {
              val item = vm.current
              var pos by remember { mutableLongStateOf(0L) }
              LaunchedEffect(vm.controller) {
                  while (true) {
                      pos = vm.position()
                      delay(500)
                  }
              }
              val dur = vm.duration()
              Column(
                  Modifier.fillMaxWidth()
                      .clip(RoundedCornerShape(topStart = 24.dp, topEnd = 24.dp))
                      .background(OPurple)
                      .clickable { if (item != null) onOpen() else onStartAll() }
              ) {
                  LinearProgressIndicator(
                      progress = { if (dur > 0) (pos.toFloat() / dur.toFloat()).coerceIn(0f, 1f) else 0f },
                      modifier = Modifier.fillMaxWidth().height(2.dp),
                      color = OBlue,
                      trackColor = Color.Transparent
                  )
                  Row(
                      Modifier.padding(horizontal = 16.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Art(item?.mediaId?.toLongOrNull() ?: -1L, Modifier.size(48.dp))
                      Spacer(Modifier.width(14.dp))
                      Column(Modifier.weight(1f)) {
                          Text(
                              item?.mediaMetadata?.title?.toString() ?: "Tocar para reproducir",
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                              fontWeight = FontWeight.Bold,
                              fontSize = 16.sp
                          )
                          if (item != null) {
                              Text(
                                  item.mediaMetadata.artist?.toString() ?: "",
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  color = OGrey,
                                  fontSize = 13.sp
                              )
                          }
                      }
                      IconButton(onClick = { if (item != null) vm.toggle() else onStartAll() }) {
                          Icon(
                              if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                              contentDescription = null,
                              modifier = Modifier.size(34.dp)
                          )
                      }
                  }
              }
          }

          @Composable
          fun PlayerScreen(vm: PlayerVM, onClose: () -> Unit) {
              val item = vm.current
              val id = item?.mediaId ?: ""
              var pos by remember { mutableLongStateOf(0L) }
              var drag by remember { mutableStateOf<Float?>(null) }
              LaunchedEffect(vm.controller) {
                  while (true) {
                      if (drag == null) pos = vm.position()
                      delay(300)
                  }
              }
              val dur = vm.duration()
              var dlgSleep by remember { mutableStateOf(false) }
              var queueOpen by remember { mutableStateOf(false) }
              var eqOpen by remember { mutableStateOf(false) }
              val isFav = id in vm.favs

              Surface(Modifier.fillMaxSize(), color = OPurple, contentColor = Color.White) {
                  Column(
                      Modifier.fillMaxSize().padding(horizontal = 24.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Row(Modifier.fillMaxWidth().padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onClose) {
                              Icon(Icons.Rounded.KeyboardArrowDown, contentDescription = null, modifier = Modifier.size(36.dp))
                          }
                      }
                      Art(id.toLongOrNull() ?: -1L, Modifier.fillMaxWidth().aspectRatio(1f), 96.dp, 28.dp)
                      Spacer(Modifier.height(20.dp))
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text(
                                  item?.mediaMetadata?.title?.toString() ?: "",
                                  fontSize = 22.sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  item?.mediaMetadata?.artist?.toString() ?: "",
                                  color = OGrey,
                                  fontSize = 15.sp,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                          IconButton(onClick = { if (id.isNotEmpty()) vm.toggleFav(id) }) {
                              Icon(
                                  if (isFav) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                                  contentDescription = null,
                                  tint = if (isFav) OBlue else Color.White
                              )
                          }
                      }
                      Spacer(Modifier.weight(1f))

                      Slider(
                          value = drag ?: pos.toFloat(),
                          onValueChange = { drag = it },
                          onValueChangeFinished = {
                              drag?.let {
                                  vm.seek(it.toLong())
                                  pos = it.toLong()
                              }
                              drag = null
                          },
                          valueRange = 0f..maxOf(dur.toFloat(), 1f),
                          colors = SliderDefaults.colors(
                              thumbColor = Color.White,
                              activeTrackColor = Color.White,
                              inactiveTrackColor = Color(0x33FFFFFF)
                          )
                      )
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(fmt(drag?.toLong() ?: pos), color = OGrey, fontSize = 13.sp)
                          Text(fmt(dur), color = OGrey, fontSize = 13.sp)
                      }
                      Spacer(Modifier.height(12.dp))

                      Row(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = { vm.toggleShuffle() }) {
                              Icon(
                                  Icons.Rounded.Shuffle,
                                  contentDescription = null,
                                  tint = if (vm.shuffle) OBlue else OGrey
                              )
                          }
                          IconButton(onClick = { vm.prev() }, modifier = Modifier.size(56.dp)) {
                              Icon(Icons.Rounded.SkipPrevious, contentDescription = null, modifier = Modifier.size(40.dp))
                          }
                          Box(
                              Modifier.size(76.dp).clip(CircleShape).background(Color.White)
                                  .clickable { vm.toggle() },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                  contentDescription = null,
                                  tint = OPurple,
                                  modifier = Modifier.size(46.dp)
                              )
                          }
                          IconButton(onClick = { vm.next() }, modifier = Modifier.size(56.dp)) {
                              Icon(Icons.Rounded.SkipNext, contentDescription = null, modifier = Modifier.size(40.dp))
                          }
                          IconButton(onClick = { vm.cycleRepeat() }) {
                              Icon(
                                  if (vm.repeat == Player.REPEAT_MODE_ONE) Icons.Rounded.RepeatOne else Icons.Rounded.Repeat,
                                  contentDescription = null,
                                  tint = if (vm.repeat == Player.REPEAT_MODE_OFF) OGrey else OBlue
                              )
                          }
                      }
                      Spacer(Modifier.height(16.dp))

                      Row(
                          Modifier.fillMaxWidth().padding(bottom = 20.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = { eqOpen = true }) {
                              Icon(Icons.Rounded.Tune, contentDescription = null, modifier = Modifier.size(28.dp))
                          }
                          IconButton(onClick = { dlgSleep = true }) {
                              Icon(
                                  Icons.Rounded.Bedtime,
                                  contentDescription = null,
                                  modifier = Modifier.size(28.dp),
                                  tint = if (vm.sleepEnd > 0) OBlue else Color.White
                              )
                          }
                          IconButton(onClick = { queueOpen = true }) {
                              Icon(Icons.AutoMirrored.Rounded.QueueMusic, contentDescription = null, modifier = Modifier.size(28.dp))
                          }
                      }
                  }
              }

              if (dlgSleep) {
                  AlertDialog(
                      onDismissRequest = { dlgSleep = false },
                      confirmButton = {},
                      containerColor = OCard,
                      title = { Text("Temporizador para dormir") },
                      text = {
                          Column {
                              listOf(
                                  15 to "15 minutos",
                                  30 to "30 minutos",
                                  45 to "45 minutos",
                                  60 to "60 minutos",
                                  0 to "Apagar"
                              ).forEach { (m, n) ->
                                  Text(
                                      n,
                                      modifier = Modifier.fillMaxWidth().clickable {
                                          vm.setSleep(m)
                                          dlgSleep = false
                                      }.padding(vertical = 14.dp),
                                      fontSize = 17.sp,
                                      color = Color.White
                                  )
                              }
                          }
                      }
                  )
              }
              if (queueOpen) QueueSheet(vm) { queueOpen = false }
              if (eqOpen) EqSheet { eqOpen = false }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun QueueSheet(vm: PlayerVM, onDismiss: () -> Unit) {
              ModalBottomSheet(onDismissRequest = onDismiss, containerColor = OPurple, contentColor = Color.White) {
                  val curIdx = (vm.controller?.currentMediaItemIndex ?: 0).coerceIn(0, maxOf(0, vm.queue.size - 1))
                  val st = rememberLazyListState(initialFirstVisibleItemIndex = curIdx)
                  Text(
                      "Fila (" + vm.queue.size + ")",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.ExtraBold,
                      modifier = Modifier.padding(horizontal = 24.dp, vertical = 8.dp)
                  )
                  LazyColumn(state = st, modifier = Modifier.fillMaxHeight(0.8f)) {
                      itemsIndexed(vm.queue) { i, m ->
                          val cur = i == curIdx
                          Row(
                              Modifier.fillMaxWidth().clickable { vm.jump(i) }
                                  .padding(horizontal = 24.dp, vertical = 6.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Art(m.mediaId.toLongOrNull() ?: -1L, Modifier.size(48.dp))
                              Spacer(Modifier.width(14.dp))
                              Column {
                                  Text(
                                      m.mediaMetadata.title?.toString() ?: "",
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      color = if (cur) OBlue else Color.White,
                                      fontWeight = FontWeight.Medium
                                  )
                                  Text(
                                      m.mediaMetadata.artist?.toString() ?: "",
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      color = OGrey,
                                      fontSize = 13.sp
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun EqSheet(onDismiss: () -> Unit) {
              val ctx = LocalContext.current
              val tick = Eq.tick
              val n = remember(tick) { Eq.bands() }
              var on by remember(tick) { mutableStateOf(Eq.on()) }
              val levels = remember(tick) {
                  mutableStateListOf<Int>().also { l -> for (i in 0 until n) l.add(Eq.level(i)) }
              }
              val range = remember(tick) { Eq.range() }

              ModalBottomSheet(onDismissRequest = onDismiss, containerColor = OPurple, contentColor = Color.White) {
                  Column(
                      Modifier.fillMaxWidth().verticalScroll(rememberScrollState())
                          .padding(horizontal = 24.dp).padding(bottom = 32.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text(
                              "Ecualizador",
                              fontSize = 24.sp,
                              fontWeight = FontWeight.ExtraBold,
                              modifier = Modifier.weight(1f)
                          )
                          Switch(checked = on, onCheckedChange = {
                              on = it
                              Eq.setOn(ctx, it)
                          })
                      }
                      if (n == 0) {
                          Spacer(Modifier.height(12.dp))
                          Text("Reproduce una cancion para activar el ecualizador.", color = OGrey)
                      } else {
                          Spacer(Modifier.height(12.dp))
                          Row(
                              Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Eq.presets().forEachIndexed { i, pn ->
                                  Chip(pn, false) {
                                      Eq.preset(ctx, i)
                                      for (b in 0 until n) levels[b] = Eq.level(b)
                                      on = true
                                      Eq.setOn(ctx, true)
                                  }
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          for (i in 0 until n) {
                              val hz = Eq.freq(i)
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      if (hz >= 1000) (hz / 1000).toString() + " kHz" else hz.toString() + " Hz",
                                      color = OGrey,
                                      fontSize = 13.sp,
                                      modifier = Modifier.width(60.dp)
                                  )
                                  Slider(
                                      value = levels[i].toFloat(),
                                      onValueChange = {
                                          levels[i] = it.toInt()
                                          Eq.setLevel(ctx, i, it.toInt())
                                          if (!on) {
                                              on = true
                                              Eq.setOn(ctx, true)
                                          }
                                      },
                                      valueRange = range.first.toFloat()..range.second.toFloat(),
                                      modifier = Modifier.weight(1f)
                                  )
                                  Text(
                                      (levels[i] / 100).toString() + " dB",
                                      color = OGrey,
                                      fontSize = 13.sp,
                                      modifier = Modifier.width(52.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }
          EOF_ONDA
      - name: Compilar APK
        working-directory: proj
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Mostrar errores en el resumen
        if: failure()
        shell: bash
        run: |
          {
            echo "## Errores de compilacion"
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Execution failed|Caused by|Could not|not found" build.log | head -n 25 || true
            echo '```'
            echo "## Ultimas lineas"
            echo '```'
            grep -v -E "^[[:space:]]+at " build.log | tail -n 30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onda-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: onda-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
